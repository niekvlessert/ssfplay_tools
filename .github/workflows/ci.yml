name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: ${{ matrix.name }}
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            msystem: MINGW64
            package_prefix: mingw-w64-x86_64
            package_ext: zip

          - name: windows-x86
            msystem: MINGW32
            package_prefix: mingw-w64-i686
            package_ext: zip

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            git
            base-devel
            ${{ matrix.package_prefix }}-gcc
            ${{ matrix.package_prefix }}-cmake
            ${{ matrix.package_prefix }}-ninja
            ${{ matrix.package_prefix }}-zlib

      - name: Configure Windows
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSSFPLAY_BUILD_SHARED=OFF
          -DSSFPLAY_BUILD_CLI=ON
          -DSSFPLAY_BUILD_PLAYER=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install package staging
        run: cmake --install build --prefix package/ssfplay-tools --component tools

      - name: Package Windows
        shell: pwsh
        run: |
          Compress-Archive -Path package/ssfplay-tools -DestinationPath ssfplay-tools-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ssfplay-tools-${{ matrix.name }}
          path: ssfplay-tools-${{ matrix.name }}.zip

  native-unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            package_ext: tar.gz

          - name: linux-arm64
            os: ubuntu-24.04-arm
            package_ext: tar.gz

          - name: macos-intel
            os: macos-15-intel
            package_ext: tar.gz

          - name: macos-apple-silicon
            os: macos-14
            package_ext: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev libasound2-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ninja zlib

      - name: Configure Unix
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSSFPLAY_BUILD_SHARED=OFF
          -DSSFPLAY_BUILD_CLI=ON
          -DSSFPLAY_BUILD_PLAYER=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install package staging
        run: cmake --install build --prefix package/ssfplay-tools --component tools

      - name: Package Unix
        run: |
          tar -czf ssfplay-tools-${{ matrix.name }}.tar.gz -C package ssfplay-tools

      - uses: actions/upload-artifact@v4
        with:
          name: ssfplay-tools-${{ matrix.name }}
          path: ssfplay-tools-${{ matrix.name }}.${{ matrix.package_ext }}

  wasm:
    name: wasm
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14

      - name: Prepare Emscripten cache
        run: |
          echo "EM_CACHE=${RUNNER_TEMP}/emscripten-cache" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/emscripten-cache"

      - name: Configure WASM
        run: >
          emcmake cmake -S . -B build-wasm
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG"
          -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"
          -DSSFPLAY_BUILD_SHARED=OFF
          -DSSFPLAY_BUILD_CLI=OFF
          -DSSFPLAY_BUILD_WASM=ON

      - name: Build WASM
        run: cmake --build build-wasm --target ssfplay_wasm

      - name: Package WASM
        run: |
          mkdir -p package/ssfplay-wasm
          cp build-wasm/ssfplay.js build-wasm/ssfplay.wasm package/ssfplay-wasm/
          tar -czf ssfplay-wasm.tar.gz -C package ssfplay-wasm

      - uses: actions/upload-artifact@v4
        with:
          name: ssfplay-wasm
          path: ssfplay-wasm.tar.gz
