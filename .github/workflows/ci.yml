name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            generator: "Visual Studio 17 2022"
            arch: x64
            triplet: x64-windows-static
            package_ext: zip
          - name: windows-x86
            os: windows-latest
            generator: "Visual Studio 17 2022"
            arch: Win32
            triplet: x86-windows-static
            package_ext: zip
          - name: windows-arm64
            os: windows-latest
            generator: "Visual Studio 17 2022"
            arch: ARM64
            triplet: arm64-windows-static
            package_ext: zip
          - name: linux-x64
            os: ubuntu-24.04
            package_ext: tar.gz
          - name: linux-arm64
            os: ubuntu-24.04-arm
            package_ext: tar.gz
          - name: macos-intel
            os: macos-13
            package_ext: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev libasound2-dev

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build
          -G "${{ matrix.generator }}"
          -A "${{ matrix.arch }}"
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DCMAKE_BUILD_TYPE=Release
          -DSSFPLAY_BUILD_SHARED=OFF
          -DSSFPLAY_BUILD_CLI=ON
          -DSSFPLAY_BUILD_PLAYER=ON

      - name: Configure Unix
        if: runner.os != 'Windows'
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSSFPLAY_BUILD_SHARED=OFF
          -DSSFPLAY_BUILD_CLI=ON
          -DSSFPLAY_BUILD_PLAYER=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install package staging
        run: cmake --install build --config Release --prefix package/ssfplay-tools --component tools

      - name: Package Unix
        if: runner.os != 'Windows'
        run: |
          tar -czf ssfplay-tools-${{ matrix.name }}.tar.gz -C package ssfplay-tools

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path package/ssfplay-tools -DestinationPath ssfplay-tools-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ssfplay-tools-${{ matrix.name }}
          path: ssfplay-tools-${{ matrix.name }}.${{ matrix.package_ext }}

  wasm:
    name: wasm
    runs-on: ubuntu-24.04
    env:
      EM_CACHE: ${{ runner.temp }}/emscripten-cache
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Prepare Emscripten cache
        run: mkdir -p "$EM_CACHE"
      - name: Configure WASM
        run: >
          emcmake cmake -S . -B build-wasm
          -DCMAKE_BUILD_TYPE=Release
          -DSSFPLAY_BUILD_SHARED=OFF
          -DSSFPLAY_BUILD_CLI=OFF
          -DSSFPLAY_BUILD_WASM=ON
      - name: Build WASM
        run: cmake --build build-wasm --target ssfplay_wasm
      - name: Package WASM
        run: |
          mkdir -p package/ssfplay-wasm
          cp build-wasm/ssfplay.js build-wasm/ssfplay.wasm package/ssfplay-wasm/
          tar -czf ssfplay-wasm.tar.gz -C package ssfplay-wasm
      - uses: actions/upload-artifact@v4
        with:
          name: ssfplay-wasm
          path: ssfplay-wasm.tar.gz
